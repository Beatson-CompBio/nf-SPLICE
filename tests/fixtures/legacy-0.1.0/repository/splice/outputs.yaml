schema_version: 1.0.0
vocabulary_version: 1.0.0
pipeline:
  name: legacy-example
  version: 1.0.0
  repository_url: https://github.com/org/legacy-example
schema_id: https://github.com/org/legacy-example/schema/analysis-output/v1.0.0
categories:
- key: run_report
  title: Workflow reporting and run metadata
  description: Run-level reports, execution traces, and pipeline metadata.
- key: quality_control
  title: Quality control
  description: Reports and measurements used to assess data quality.
- key: quantification
  title: Quantification
  description: Per-sample and aggregate abundance measurements.
outputs:
- key: library_qc
  title: Library QC
  description: Per-library QC.
  category: quality_control
  scope:
  - library
  entity_type:
  - file
  format:
  - json
  path_patterns:
  - ^qc/{sample}/{library}\.json$
  stage: raw
- key: counts
  title: Counts
  description: Per-sample counts.
  category: quantification
  scope:
  - sample
  entity_type:
  - file
  format:
  - tsv
  path_patterns:
  - ^quant/{sample}/counts\.tsv$
- key: multiqc_report
  title: MultiQC report
  description: Run-wide MultiQC report.
  category: run_report
  scope:
  - run
  entity_type:
  - file
  format:
  - html
  path_patterns:
  - ^multiqc/multiqc_report\.html$
