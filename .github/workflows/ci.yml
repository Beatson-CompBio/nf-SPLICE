name: CI

on:
  # Every push to main (including direct merges) and to review branches.
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Local workspace is ignored
        run: git check-ignore -q .nf-splice-local/agent/probe
      - name: No development-only or secret paths are tracked
        run: python scripts/check_staged_paths.py $(git ls-files)

  checks:
    name: Tests and quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and checks
        run: python -m pip install -e '.[dev]'
      - name: Test (offline; live Nextflow and AI tests are opt-in)
        run: pytest -m "not live_agent and not nextflow"
      - name: Code quality
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy
      - name: Generated contract references are current
        run: python scripts/generate_schema_docs.py --check
      - name: Contract registry and installed CLI
        run: |
          python -m pip check
          nf-splice --version
          nf-splice schema list --json

  nf-core-coexistence:
    name: nf-core 4.0.2 coexistence (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install . nf-core==4.0.2
      - run: |
          python -m pip check
          nf-splice --version
          nf-core --version

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --outdir dist
      - name: Install the wheel without the optional AI extra
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          /tmp/wheel-env/bin/python -m pip check
          /tmp/wheel-env/bin/nf-splice --version
          /tmp/wheel-env/bin/nf-splice schema list
          /tmp/wheel-env/bin/python -c "import sys, nf_splice.cli, nf_splice.agents; assert 'claude_agent_sdk' not in sys.modules"
      - name: Optional Claude extra resolves and imports
        run: |
          python -m venv /tmp/claude-env
          /tmp/claude-env/bin/python -m pip install "$(ls dist/*.whl)[claude]"
          /tmp/claude-env/bin/python -m pip check
          /tmp/claude-env/bin/python -c "import claude_agent_sdk, nf_splice.agents.providers.claude"
