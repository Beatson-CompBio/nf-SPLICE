name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and checks
        run: python -m pip install -e '.[dev]' nf-core==4.0.2
      - name: Test
        run: pytest
      - name: Check code quality
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Check installed environment
        run: |
          python -m pip check
          nf-splice --version
          nf-core --version
