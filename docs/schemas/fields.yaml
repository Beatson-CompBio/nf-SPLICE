inputs:
  _about: |
    `inputs.schema.json` describes the workflow's input parameters as a
    standard JSON Schema 2020-12 document, so any JSON Schema validator can
    check a set of parameter values. SPLICE adds `x-splice-*` keys that say
    who may change each parameter, how to present it and how it maps to the
    engine.

    - **Written by:** `nf-splice build all`, from the reviewed
      `.splice-local/drafts/inputs.draft.yaml` (imported from
      `nextflow_schema.json`).
    - **Read by:** platforms that build parameter forms, validate submitted
      values and pass them to the engine.

    Parameters are ordinary JSON Schema property definitions (`type`,
    `default`, `enum`, `minimum`, `pattern`, `format`, `description` and
    so on), including nf-schema annotations such as `help_text` and
    `fa_icon`. They sit either directly under `properties` or inside a group
    under `$defs`. Groups are documentation only: a submitted parameter
    object is always flat. Each parameter is defined exactly once.
  _sections:
    x-splice-pipeline: "Workflow identity. It is not a runtime parameter."
    $defs: "Parameter groups, as in nf-schema. The root schema references them from `allOf`."
    "<parameter>": "SPLICE keys that may appear on any parameter definition, whether it is under `properties` or inside a `$defs` group."
    "<parameter>.x-splice-access": "Who may set the parameter's value. Enforce this on the server; it is not a presentation hint."
    "<parameter>.x-splice-ui": "Presentation hints. They never grant or restrict permission."
    "<parameter>.x-splice-data": "Marks a parameter whose value refers to data."
    "<parameter>.x-splice-source": "How the parameter maps to the engine."
  x-splice-pipeline: "Workflow identity. It is not a runtime parameter."
  x-splice-pipeline.id: "Workflow identifier, as in `bundle.json`."
  x-splice-pipeline.name: "Workflow name."
  x-splice-pipeline.version: "Workflow version."
  x-splice-pipeline.engine: "Workflow engine."
  x-splice-pipeline.repository_url: "Workflow repository."
  $defs: "Named parameter groups."
  $defs.*.properties: "Parameters of one group."
  $defs.*.required: "Parameters of the group that must be supplied."
  properties: "Parameters that belong to no group."
  "<parameter>.x-splice-access": "Access policy of the parameter."
  "<parameter>.x-splice-access.editable_by": "Who may set the value: any of `user`, `platform` and `agent`. An empty list means the value is fixed."
  "<parameter>.x-splice-ui": "Presentation hints."
  "<parameter>.x-splice-ui.visibility": "`standard` shows the parameter, `advanced` shows it in an advanced section, `hidden` hides it. Hidden parameters still exist and keep their access policy."
  "<parameter>.x-splice-ui.help_text": "SPLICE-specific help. nf-schema `help_text` is kept separately."
  "<parameter>.x-splice-ui.icon": "Icon hint."
  "<parameter>.x-splice-ui.order": "Display order within the group, lowest first."
  "<parameter>.x-splice-data": "Data reference marker."
  "<parameter>.x-splice-data.kind": "What the value refers to: a `file`, `directory`, `path` or `uri`."
  "<parameter>.x-splice-data.samplesheet": "The value is a samplesheet with its own schema."
  "<parameter>.x-splice-source": "Engine binding."
  "<parameter>.x-splice-source.engine": "Engine of the binding, for example `nextflow`."
  "<parameter>.x-splice-source.binding": "Native target of the value, for example `params.genome`."
  "<parameter>.x-splice-source.origin": "Where the definition was imported from, for example `nextflow_schema.json`."

outputs:
  _about: |
    `outputs.schema.json` has two jobs:

    1. It is the JSON Schema (draft-07) that validates the
       `analysis_output.json` each completed job produces. Its own
       `properties` and `definitions` are written for this workflow; see
       [`analysis_output.json`](../analysis-output.md).
    2. Its `x-output-catalog` key holds the reviewed catalogue of every output
       the workflow can produce: what each output is, at which granularity
       it is owned (job, sample or run) and how to recognise it by path.

    - **Written by:** `nf-splice build all`, from the reviewed
      `.splice-local/drafts/outputs.draft.yaml`. `outputs.yaml` is a human-readable
      copy of the same catalogue.
    - **Read by:** platforms that classify, store and display job outputs.
      Read the catalogue from this file only.

    The keys below are the fixed part of the document. For the
    workflow-specific runtime schema, read
    [`analysis_output.json`](../analysis-output.md).
  _sections:
    x-output-catalog: "The reviewed output catalogue."
    x-output-catalog.scopes: "Definitions of the three granularities that can own an output."
    x-output-catalog.categories: "Categories used by `output_types`, keyed by category name. Names are free text."
    x-output-catalog.output_types: "One entry per kind of output the workflow may publish, across all its supported routes."
  x-output-catalog: "Output catalogue of the workflow: every kind of output it may publish across its supported routes. A job publishes a subset."
  x-output-catalog.catalog_version: "Revision of the catalogue format."
  x-output-catalog.schema_semantics: "Short statement of how the catalogue is meant to be read."
  x-output-catalog.analysis_output_schema_version: "Version of this workflow's `analysis_output.json` schema. Reviewers raise it when the runtime document changes."
