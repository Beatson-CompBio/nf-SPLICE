# Meaning, consumer use and privacy of every key in the five workflow-bundle
# contract families. Types, requiredness and constraints are generated from
# the packaged formal definitions (scripts/generate_schema_docs.py).
# use: who reads the key (ingestion, DEX, UI, runtime). privacy: public
# unless stated. Keys under "common" apply to every family that has them.
common:
  schema_id: {meaning: "Family URI of this document's contract.", use: "Ingestion selects the validator by it."}
  schema_version: {meaning: "Contract revision of this document (not the tool or pipeline version).", use: "Ingestion compatibility gate."}
  generated_by: {meaning: "Generator identity.", use: "Provenance and support."}
  generated_by.name: {meaning: "Generator name (nf-splice).", use: "Provenance."}
  generated_by.version: {meaning: "Generator release that wrote the file.", use: "Provenance; see the contract registry."}
  pipeline: {meaning: "Identity envelope linking a detached file to its workflow.", use: "Cross-file consistency check."}
  pipeline.id: {meaning: "Stable bundle identifier (slug), derived once.", use: "Primary workflow key in ingestion."}
  pipeline.name: {meaning: "Pipeline name.", use: "Display and matching."}
  pipeline.version: {meaning: "Upstream pipeline release version.", use: "Version selection in the platform."}
  pipeline.engine: {meaning: "Workflow engine (nextflow in 0.3.0).", use: "Selects the execution adapter."}
  pipeline.repository_url: {meaning: "Canonical source repository URL.", use: "Provenance and links."}
  x-splice-contract: {meaning: "Family URI and revision of a JSON Schema document (separate from $schema/$id).", use: "Contract validation."}
  x-splice-contract.id: {meaning: "Family URI.", use: "Validator selection."}
  x-splice-contract.version: {meaning: "Family revision.", use: "Compatibility gate."}
  x-splice-contract.generated_by: {meaning: "Generator identity.", use: "Provenance."}
  x-splice-contract.generated_by.name: {meaning: "Generator name.", use: "Provenance."}
  x-splice-contract.generated_by.version: {meaning: "Generator release.", use: "Provenance."}
  x-splice-draft: {meaning: "Draft marker; must be absent from published files.", use: "Rejected by validation if present."}
  $schema: {meaning: "Standard JSON Schema dialect of the document.", use: "Schema validator selection."}
  $id: {meaning: "Per-pipeline identity of the instance schema (not the family URI).", use: "Schema references."}
  type: {meaning: "Instance type validated by the schema (object).", use: "JSON Schema."}
