# Descriptions for every key of the five workflow-bundle contract families.
#
# scripts/generate_schema_docs.py combines these descriptions with the types,
# requiredness and constraints of the packaged formal definitions to write
# docs/schemas/<family>/README.md. `--check` fails when a key has no
# description or a page is stale.
#
# Per family:
#   _about     Markdown introduction: what the file is, who writes and reads it.
#   _sections  Optional introductions for an object's section, keyed by path.
#   <path>     A description string, or {description, privacy} for keys that
#              can hold personal data.
# Keys under `common` apply to every family that has them. Input parameter
# extensions are keyed as `<parameter>.<key>`.

common:
  schema_id: "Contract family URI. Use it to choose the validator for this file."
  schema_version: "Contract revision of this file. This is not the nf-splice version or the pipeline version."
  generated_by: "Tool that wrote the file."
  generated_by.name: "Generator name, for example `nf-splice`."
  generated_by.version: "Generator release that wrote the file."
  pipeline: "Identity of the workflow this file belongs to. It repeats the identity in `bundle.json` so a detached file can be matched to its bundle."
  pipeline.id: "Stable workflow identifier. Use it as the primary key for the workflow."
  pipeline.name: "Workflow name."
  pipeline.version: "Released version of the workflow."
  pipeline.engine: "Workflow engine that runs the workflow. Always `nextflow` in this revision."
  pipeline.repository_url: "Canonical source repository of the workflow."
  x-splice-contract: "Contract family and revision of this JSON Schema document, kept separate from the standard `$schema` and `$id` keys."
  x-splice-contract.id: "Contract family URI."
  x-splice-contract.version: "Contract revision."
  x-splice-contract.generated_by: "Tool that wrote the file."
  x-splice-contract.generated_by.name: "Generator name, for example `nf-splice`."
  x-splice-contract.generated_by.version: "Generator release that wrote the file."
  x-splice-draft: "Draft marker used while authoring. A published file never contains it; validation rejects files that do."
  $schema: "Standard JSON Schema dialect of this document."
  $id: "Identifier of this workflow's schema. It is specific to the workflow and is not the contract family URI."
  type: "Type of the instance this schema validates. Always `object`."

bundle:
  _about: |
    `bundle.json` is the entry point of a SPLICE workflow bundle. It identifies
    the workflow, credits its authors, lists the contract revision of every
    other file and says where each file is.

    - **Written by:** `nf-splice build all`, from the reviewed
      `.splice-local/drafts/bundle.draft.yaml`.
    - **Read by:** anything that ingests a bundle. Read this file first, then
      follow `schemas` and `files` to the other four contracts.
  _sections:
    pipeline: "Workflow identity and descriptive metadata. Only `id`, `name`, `version`, `engine` and `repository_url` are required; every other key appears only when it was reviewed."
    maintainers: "Public contacts for the workflow. They are published only when the maintainers' consent was recorded, and are never derived from Git."
    schemas: "One entry per contract family, keyed by family URI. All five families are always present."
    files: "Paths of the bundle's files, relative to the directory that holds `bundle.json`."
  bundle_format: "Marks the file as a SPLICE workflow bundle index."
  pipeline.title: "Display title."
  pipeline.description: "One- or two-sentence summary for listings and search."
  pipeline.long_description: "Longer description for a detail page."
  pipeline.readme: "README reference or text."
  pipeline.project_url: "Project website, when it differs from the repository."
  pipeline.release_url: "Release page of this exact version. Validation checks that it matches `version`."
  pipeline.authors: "Credited authors of the workflow, in citation order. People who only reviewed the integration are not authors."
  pipeline.authors[].name: "Name of the person or organisation."
  pipeline.authors[].type: "Whether the author is a person or an organisation."
  pipeline.authors[].affiliation: "Affiliation of the author."
  pipeline.authors[].orcid: "ORCID identifier of a person, as a full URL."
  pipeline.authors[].role: "Contribution role, as free text."
  pipeline.funders: "Funding bodies. Award identifiers appear only when they were sourced, never guessed."
  pipeline.funders[].name: "Funder name."
  pipeline.funders[].award_id: "Award or grant identifier."
  pipeline.funders[].award_title: "Award title."
  pipeline.funders[].url: "Funder or award web page."
  pipeline.citation: "How to cite the workflow. At least one of the keys below is present."
  pipeline.citation.doi: "DOI without a resolver prefix, for example `10.5281/zenodo.123`."
  pipeline.citation.url: "Citation web page."
  pipeline.citation.text: "Formatted citation text."
  pipeline.citation.cff_path: "Repository path of the workflow's `CITATION.cff` file."
  pipeline.licence: "Licence identifier, preferably an SPDX identifier such as `MIT`."
  pipeline.licence_url: "Link to the licence text."
  pipeline.documentation_url: "User documentation of the workflow."
  pipeline.support_url: "Public support page, published only when approved."
  pipeline.engine_version_min: "Minimum engine version the workflow declares."
  pipeline.engine_versions_tested: "Engine version or range the workflow was tested with."
  pipeline.keywords: "Free-text keywords for search. There is no controlled vocabulary."
  pipeline.pipeline_type: "Free-text kind of workflow, for grouping in a catalogue."
  pipeline.modality: "Free-text data modality, for grouping in a catalogue."
  pipeline.released_at: "Release date and time, when sourced."
  maintainers: {description: "Public maintainer contacts.", privacy: "Personal data. Published only with recorded consent."}
  maintainers[].name: {description: "Contact name.", privacy: "Personal data. Published only with recorded consent."}
  maintainers[].role: "Contact role."
  maintainers[].affiliation: "Contact affiliation."
  maintainers[].contact_url: "Public contact page."
  maintainers[].email: {description: "Public contact e-mail address.", privacy: "Personal data. Published only with recorded consent; never taken from Git."}
  schemas: "Contract revision and path of each of the five files."
  schemas.*.version: "Contract revision of the referenced file. Reject revisions your code does not support."
  schemas.*.path: "Path of the referenced file."
  files: "File index. There is no `outputs.json`: output metadata lives in `outputs.schema.json`."
  files.inputs_schema: "Path of `inputs.schema.json`."
  files.outputs_catalogue: "Path of `outputs.yaml`, a human-readable view of the output catalogue. Programs should read `outputs_schema` instead."
  files.outputs_schema: "Path of `outputs.schema.json`, which holds the output catalogue."
  files.ro_crate: "Path of the published RO-Crate."
  files.components: "Path of `components.json`."
  files.execution_profiles: "Path of `execution-profiles.json`."
