  schemas.*.path: {meaning: "Relative path of the referenced file.", use: "File location."}
  files: {meaning: "Bundle file index (no outputs.json).", use: "File location."}
  files.inputs_schema: {meaning: "Path of inputs.schema.json.", use: "File location."}
  files.outputs_catalogue: {meaning: "Path of outputs.yaml (developer-readable).", use: "Not needed by JSON consumers."}
