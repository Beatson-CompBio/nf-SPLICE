  containers[].distribution.sha256: "SHA-256 of the file, computed by nf-splice from the bytes it downloaded. Check it after downloading."
  containers[].distribution.size_bytes: "File size in bytes."
  containers[].distribution.filename: "File name of the image."
  containers[].distribution.format: "Image format: `sif` or `img`."
  containers[].distribution.cache_filename: "File name Nextflow's Singularity or Apptainer cache uses for the source image. Store the file under this name to pre-populate the cache."
  containers[].distribution.source_runtime: "Runtime the file is for."
  containers[].distribution.source_image_digest: "Digest of the upstream image, when known."
  containers[].resolution: "Readiness."
  containers[].resolution.status: "Readiness state. Published bundles contain `resolved` (native reference only) or `verified` (downloadable file)."
  containers[].resolution.reasons: "Machine-readable reasons for the state."
  components: "Workflow modules."
  components[].id: "Stable module identifier."
  components[].type: "Kind of component. Always `workflow_module` in this revision."
