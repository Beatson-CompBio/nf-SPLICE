components:
  _about: |
    `components.json` lists the software the workflow runs and the container
    images it needs. It keeps three things apart: the native image
    references for each runtime, the modules that use them and, when one has
    been verified, a downloadable image file.

    - **Written by:** `nf-splice build all`, from the reviewed
      `.splice-local/drafts/components.draft.yaml`.
    - **Read by:** platforms that pre-fetch or cache images before running
      jobs, and software inventories.

    To fetch an image, use `distribution` when it is present: it is a file
    nf-splice downloaded and hashed itself. Otherwise use `source_images`
    with the matching runtime. A registry reference such as
    `quay.io/org/tool:1.0` is not a downloadable file.
  _sections:
    containers: "Container images, one entry per logical image."
    containers[].source_images: "Native image references, one per runtime. At least one is present."
    containers[].distribution: "A verified, directly downloadable image file. Present only after `nf-splice containers verify` succeeded."
    containers[].resolution: "Readiness of the image."
    components: "Workflow modules found in the repository."
    components[].tool: "Tool the module wraps."
  require_downloadable_images: "When `true`, every container has a verified `distribution`, and a platform should refuse a bundle where one cannot be downloaded rather than fall back silently."
  containers: "Container images."
  containers[].id: "Stable container identifier. Modules link to it through `container_id`."
  containers[].type: "Runtime of `uri`: `singularity` or `apptainer` for a verified distribution, otherwise the runtime of the native reference."
  containers[].uri: "The verified download URL when a distribution exists, otherwise the native reference. A convenience summary: prefer `distribution` and `source_images`, which say exactly what can be downloaded and for which runtime."
  containers[].source_images: "Native references."
  containers[].source_images.docker: "Docker or OCI registry reference."
  containers[].source_images.singularity: "Singularity reference."
  containers[].source_images.apptainer: "Apptainer reference."
