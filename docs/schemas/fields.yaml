  files.components: {meaning: "Path of components.json.", use: "Image pre-caching."}
  files.execution_profiles: {meaning: "Path of execution-profiles.json.", use: "Execution selection."}
  default_execution_profile: {meaning: "Reviewed platform default profile id.", use: "Default execution selection."}
