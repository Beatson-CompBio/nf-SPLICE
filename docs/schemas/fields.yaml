execution-profiles:
  _about: |
    `execution-profiles.json` lists the reviewed ways to run the workflow,
    each with its own Nextflow configuration file under `configs/`, and names
    one default.

    - **Written by:** `nf-splice build all`, from the reviewed
      `.splice-local/drafts/execution-profiles.draft.yaml`.
    - **Read by:** platforms that choose a configuration when they launch a
      job.

    Profiles never contain site accounts, queues or credentials. Values an
    operator must supply are listed in `site_parameters`.
  _sections:
    profiles: "Reviewed execution profiles."
    profiles[].site_parameters: "Settings the operator configures at deployment. The bundle never holds their values."
  default_profile: "Identifier of the default profile. Matches one `profiles[].id`, and that profile has `default: true`."
  profiles: "Execution profiles."
  profiles[].id: "Stable profile identifier."
  profiles[].name: "Display name."
  profiles[].description: "What the profile is for."
  profiles[].type: "Intended use: `test`, `development` or `production`."
  profiles[].engine: "Workflow engine."
  profiles[].executor: "Nextflow executor, for example `local` or `slurm`."
  profiles[].container_engine: "Container runtime, for example `singularity` or `docker`."
  profiles[].config: "Configuration file of the profile, relative to the bundle directory. Pass it to the engine, for example with `nextflow run -c`."
  profiles[].default: "Whether this is the default profile."
  profiles[].config_strategy: "`adopted`: a byte-identical copy of a configuration from the workflow repository. `generated`: written by nf-splice."
  profiles[].site_parameters: "Operator settings."
